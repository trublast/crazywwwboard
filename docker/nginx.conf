## nginx for CrazyWWWBoard : static files + CGIs through fcgiwrap
## Runs as non-root user on a read-only root filesystem, writable : /tmp, /run/cwb

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # must not exceed 32MB, the request limit of the CGIs
  client_max_body_size 10m;
  client_body_timeout  30s;
  send_timeout         30s;

  # Password guessing : the CGIs check passwords without any limit, so nginx
  # limits requests per client IP.
  # CrazyWWWBoard.cgi : only requests that can carry a password are counted,
  # that is POST, '?password=' and the PASSWORD cookie (it holds the hash,
  # which works as the password). Plain browsing is not limited.
  map $request_method$arg_password$cookie_PASSWORD $cwb_auth_key {
    "GET"   "";
    "HEAD"  "";
    default $binary_remote_addr;
  }
  limit_req_zone $cwb_auth_key       zone=cwb_board:1m rate=30r/m;
  # CrazyAdmin.cgi : every request carries the master password
  limit_req_zone $binary_remote_addr zone=cwb_admin:1m rate=30r/m;
  limit_req_status 429;

  server {
    listen 8080;
    server_name _;
    root /srv;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
      return 302 /cgi-bin/CrazyWWWBoard.cgi$is_args$args;
    }

    # Only these two CGIs can be executed
    location = /cgi-bin/CrazyWWWBoard.cgi {
      limit_req zone=cwb_board burst=30 nodelay;
      include /etc/nginx/cwb_fastcgi.conf;
    }

    location = /cgi-bin/CrazyAdmin.cgi {
      include /run/cwb/admin_access.conf;
      limit_req zone=cwb_admin burst=30 nodelay;
      include /etc/nginx/cwb_fastcgi.conf;
    }

    location /cgi-bin/ {
      return 404;
    }

    # Icons and messages (read-only in the image)
    location /cwb-data/ {
      location ~ ^/cwb-data/message/(htmlhead|htmltail|mailhead|mailtail) {
        return 404;
      }

      # Uploaded files : served as passive content only.
      # Whitelist : only var/data/<board>/<file> with the names the CGI creates.
      # Everything else there is denied : board databases (*.gdbm) and the
      # temporary copies gdbm makes while reorganizing ('#board.gdbm#').
      location /cwb-data/var/data/ {
        location ~ "^/cwb-data/var/data/[A-Za-z0-9]{1,32}/[A-Za-z0-9_-][A-Za-z0-9._-]{0,70}$" {
          types {
            image/gif  gif;
            image/jpeg jpg jpeg jpe;
            image/png  png;
            text/plain txt;
          }
          default_type application/octet-stream;
          charset off;

          add_header Content-Security-Policy "default-src 'none'; sandbox" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
        }
        return 404;
      }

      # statistics, logs and anything else under var
      location /cwb-data/var/ {
        return 404;
      }
    }

    location / {
      return 404;
    }
  }
}
