## nginx for CrazyWWWBoard : static files + CGIs through fcgiwrap
## Runs as non-root user on a read-only root filesystem, writable : /tmp, /run/cwb

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # must not exceed 32MB, the request limit of the CGIs
  client_max_body_size 10m;
  client_body_timeout  30s;
  send_timeout         30s;

  server {
    listen 8080;
    server_name _;
    root /srv;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
      return 302 /cgi-bin/CrazyWWWBoard.cgi$is_args$args;
    }

    # Only these two CGIs can be executed
    location = /cgi-bin/CrazyWWWBoard.cgi {
      include /etc/nginx/cwb_fastcgi.conf;
    }

    location = /cgi-bin/CrazyAdmin.cgi {
      include /run/cwb/admin_access.conf;
      include /etc/nginx/cwb_fastcgi.conf;
    }

    location /cgi-bin/ {
      return 404;
    }

    # Icons and messages (read-only in the image)
    location /cwb-data/ {
      location ~ ^/cwb-data/message/(htmlhead|htmltail|mailhead|mailtail) {
        return 404;
      }

      # Uploaded files : served as passive content only
      location /cwb-data/var/data/ {
        # boards database files
        location ~ \.(gdbm|stat-gdbm)$ {
          return 404;
        }

        types {
          image/gif  gif;
          image/jpeg jpg jpeg jpe;
          image/png  png;
          text/plain txt;
        }
        default_type application/octet-stream;
        charset off;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
      }

      # statistics, logs and anything else under var
      location /cwb-data/var/ {
        return 404;
      }
    }

    location / {
      return 404;
    }
  }
}
